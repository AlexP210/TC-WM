name: robomimic_square
args: []
kwargs: 
  with_velocity: true
  with_target: true

dataset:
  _target_: "datasets.robomimic_dset.load_robomimic_slice_train_val"
  with_velocity: true
  n_rollout: null
  normalize_action: ${normalize_action}
